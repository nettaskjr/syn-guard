name: CI/CD para syn-guard

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Análise Estática e Verificação de Sintaxe
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar ShellCheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Verificar a sintaxe do script
      run: bash -n syn-guard.sh

    - name: Análise estática com ShellCheck
      run: shellcheck syn-guard.sh

  release:
    name: Criar Release e Pacote
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'

      - name: Gerar nova Tag e Changelog
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar pacote de distribuição
        run: |
          tar -czvf syn-guard-${{ steps.tag_version.outputs.new_tag }}.tar.gz syn-guard.sh

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}
          files: syn-guard-${{ steps.tag_version.outputs.new_tag }}.tar.gz