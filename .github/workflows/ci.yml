name: CI/CD para syn-guard

on:
  push:
    branches: [ main ]
    tags:
      - 'v*' # Executa para tags como v1.0, v1.2.3
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Análise Estática e Verificação de Sintaxe
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Instalar ShellCheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Verificar a sintaxe do script
      run: bash -n syn-guard.sh

    - name: Análise estática com ShellCheck
      run: shellcheck syn-guard.sh

  release:
    name: Criar Release e Pacote
    runs-on: ubuntu-latest
    needs: lint # A release só acontece se o lint passar
    if: startsWith(github.ref, 'refs/tags/') # Executa este job apenas para tags

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Criar pacote de distribuição
        run: |
          tar -czvf syn-guard-${{ github.ref_name }}.tar.gz syn-guard.sh README.md PLANO_DE_TESTES.md

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v1
        with:
          files: syn-guard-${{ github.ref_name }}.tar.gz